name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: monitor
          POSTGRES_PASSWORD: monitor
          POSTGRES_DB: edstellar_monitor
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U monitor" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://monitor:monitor@localhost:5432/edstellar_monitor
      AUTH_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
      ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      SEED_ADMIN_EMAIL: ci@example.com
      SEED_ADMIN_PASSWORD: ci-password-1234
      CRON_SECRET: ci-cron-secret-ci-cron-secret
      APP_URL: http://localhost:3100
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npx prisma migrate deploy
      - run: npm run db:seed
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Smoke test (production server, every screen and export)
        run: |
          npx next start -p 3100 > next.log 2>&1 &
          for i in $(seq 1 60); do curl -fs http://localhost:3100/api/health > /dev/null && break; sleep 1; done
          SMOKE_URL=http://localhost:3100 npm run smoke
      - name: Load test (2,000 pages through the real engine and database)
        run: npm run loadtest -- 2000
      - name: Server log
        if: failure()
        run: cat next.log || true
