# Scheduled monitoring on GitHub Actions: every four hours, queue the websites
# that are due and run them. Needs a database reachable from GitHub (e.g. Neon),
# not a database on your own machine. Set these repository secrets:
#   DATABASE_URL, APP_URL, ENCRYPTION_KEY and, optionally, SMTP_HOST, SMTP_PORT,
#   SMTP_USER, SMTP_PASSWORD, NOTIFY_FROM_EMAIL, PAGESPEED_API_KEY.
# Scheduled workflows can start late and only run on the default branch.
# See docs/DEPLOYMENT.md for the alternatives (an always-on worker, or the cron endpoint).
name: Monitor
on:
  schedule:
    - cron: "7 */4 * * *"
  workflow_dispatch:
    inputs:
      website:
        description: "Scan this website now (domain). Leave empty to run what is due."
        required: false

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  monitor:
    if: ${{ vars.MONITOR_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      APP_URL: ${{ secrets.APP_URL }}
      ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      NOTIFY_FROM_EMAIL: ${{ secrets.NOTIFY_FROM_EMAIL }}
      PAGESPEED_API_KEY: ${{ secrets.PAGESPEED_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npx prisma migrate deploy
      - name: Run monitoring
        run: |
          if [ -n "${{ github.event.inputs.website }}" ]; then
            npm run worker -- --website "${{ github.event.inputs.website }}"
          else
            npm run worker -- --due
          fi
